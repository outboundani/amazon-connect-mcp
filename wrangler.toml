name = "amazon-connect-mcp"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Configuration comes from one of two places (env wins if both are set):
#   1. The in-browser setup wizard at /setup - stores config in the KV
#      namespace below. Easiest path; no terminal needed after deploy.
#   2. Wrangler secrets (`npx wrangler secret put <NAME>`):
#      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION / MCP_AUTH_TOKEN
#      (CONNECT_INSTANCE_ID is optional when the region has exactly one
#      instance; AWS_SESSION_TOKEN only for temporary credentials)
#
# Use a dedicated IAM user with docs/iam-policy.json attached. It allows only
# what the tools do and explicitly DENIES deletes, go-live wiring, dialing,
# and number inventory changes, so AWS enforces the promise too.
#
# KV namespace for wizard-managed config. The `id` is intentionally omitted so
# the namespace is auto-provisioned into the deploying account: the "Deploy to
# Cloudflare" button and `npx wrangler deploy` both create it and write the id
# back to this file on first deploy. (If you'd rather pin an existing namespace,
# run `npx wrangler kv namespace create CONFIG` and add `id = "..."` below.)
[[kv_namespaces]]
binding = "CONFIG"
